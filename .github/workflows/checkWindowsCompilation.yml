name: Windows Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@master
        with:
          cuda: '13.0.0'
          method: 'network'

      - name: Install Intel oneAPI (Fortran)
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel
          version: '2024.1'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add CUDA and Intel to PATH
        run: |
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.0\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files (x86)\Intel\oneAPI\compiler\latest\bin" >> $env:GITHUB_PATH

      # Add the Intel bin path here if necessary, usually handled by Intel's setvars.bat
      - name: Configure CMake
        shell: cmd
        run: cmake -S . -B build -G "Ninja" -DCMAKE_Fortran_COMPILER=ifx -DCMAKE_BUILD_TYPE=Debug

      - name: Build Project
        shell: cmd
        run: cmake --build build -j 4

      - name: Run Unit Tests
        working-directory: build
        shell: cmd
        run: ctest --output-on-failure