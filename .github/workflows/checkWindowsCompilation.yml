name: Windows Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-2022
    
    # Opt into Node 24 to fix the deprecation warnings
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install CUDA Toolkit
      # Use @master to get the latest supported version manifest
      uses: Jimver/cuda-toolkit@master
      with:
        cuda: '13.0.0' # If this still fails, try changing to a stable 12.x like '12.6.0'
        method: 'network'

    - name: Install Intel oneAPI (Fortran)
      uses: fortran-lang/setup-fortran@v1
      with:
        compiler: intel-classic
        version: '2021.12' 


    - name: Configure CMake
      run: cmake -S . -B build -G "Visual Studio 17 2022" -DCMAKE_Fortran_COMPILER=ifx

    - name: Build Project
      run: cmake --build build --config Debug -j 4

    - name: Run Unit Tests
      working-directory: build
      run: ctest --output-on-failure -C Debug
