name: Windows Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-2022
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MSYS_NO_PATHCONV: 1  # Protects CUDA nvcc flags from being mangled on Windows CI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@master
        with:
          cuda: '13.0.0'
          method: 'network'

      - name: Install Intel oneAPI (Fortran)
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel
          version: '2024.1'

      - name: Remove Git/MSYS from PATH
        shell: pwsh
        run: |
          $filtered = ($env:PATH -split ';') | Where-Object {
            $_ -notmatch '\\Git\\usr' -and
            $_ -notmatch '\\Git\\bin' -and
            $_ -notmatch 'mingw64' -and
            $_ -notmatch 'msys'
          }
          "PATH=$($filtered -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: cmd
        run: cmake -S . -B build -G "Ninja" -DCMAKE_Fortran_COMPILER=ifx -DCMAKE_BUILD_TYPE=Debug

      - name: Build Project
        shell: cmd
        run: cmake --build build -j 4

      - name: Run Unit Tests
        working-directory: build
        shell: cmd
        run: ctest --output-on-failure